    <text x="24" y="374" class="small">Exceto cabelo extra longo ou com mega hair.</text>
    <text x="24" y="437" class="cta">AGENDAR  ↗</text><line x1="24" y1="447" x2="107" y2="447" class="line"/>
  </g>
  <g transform="translate(710 520)">
    <text x="24" y="208" class="number">07</text><line x1="49" y1="204" x2="77" y2="204" class="line"/>
