  <text x="70" y="1054" class="sans muted" font-size="11">Ofertas válidas de segunda a quarta, exceto feriados. Consulte vigência, disponibilidade e formas de pagamento pelo WhatsApp.</text>
  <text x="1330" y="1054" class="sans muted" font-size="10" text-anchor="end">FOTOS ILUSTRATIVAS PARA DEFINIÇÃO DO LAYOUT</text>
