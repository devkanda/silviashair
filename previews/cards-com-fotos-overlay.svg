    <text x="24" y="326" class="old">DE R$ 180,00</text><text x="24" y="361" class="price">R$ 150,00</text>
    <text x="24" y="437" class="cta">AGENDAR  ↗</text><line x1="24" y1="447" x2="107" y2="447" class="line"/>
