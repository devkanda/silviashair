<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; fill: #1d1d1a; }
    .sans { font-family: Arial, Helvetica, sans-serif; fill: #1d1d1a; }
    .muted { fill: #726b61; }
    .number { font-family: Arial, Helvetica, sans-serif; fill: #8d806d; font-size: 10px; letter-spacing: 2px; }
    .title { font-family: Georgia, 'Times New Roman', serif; fill: #1d1d1a; font-size: 29px; }
    .price { font-family: Arial, Helvetica, sans-serif; fill: #1d1d1a; font-size: 28px; font-weight: 700; letter-spacing: -1px; }
    .old { font-family: Arial, Helvetica, sans-serif; fill: #726b61; font-size: 10px; text-decoration: line-through; }
    .small { font-family: Arial, Helvetica, sans-serif; fill: #726b61; font-size: 9px; }
    .cta { font-family: Arial, Helvetica, sans-serif; fill: #1d1d1a; font-size: 11px; font-weight: 700; }
    .line { stroke: #b7975b; stroke-width: 1; }
  </style>
  <!-- Corpos dos cards, sobrepostos às fotografias -->
  <g fill="#f7f3ec">
    <rect x="70" y="190" width="300" height="310" rx="16"/>
    <rect x="390" y="190" width="300" height="310" rx="16"/>
    <rect x="710" y="190" width="300" height="310" rx="16"/>
    <rect x="1030" y="190" width="300" height="310" rx="16"/>
    <rect x="70" y="690" width="300" height="310" rx="16"/>
    <rect x="390" y="690" width="300" height="310" rx="16"/>
    <rect x="710" y="690" width="300" height="310" rx="16"/>
    <rect x="1030" y="690" width="300" height="310" rx="16"/>
  </g>
  <g fill="none" stroke="#cfc5b6">
